<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ALEX Graphic Design Studio - Creative graphic design, professional printing & video editing. Logo design, business cards, flex banners, social media posts, customized gifts & more. Chat on WhatsApp." />
    <meta name="theme-color" content="#0A0A0A" />
    <title>ALEX Graphic Design Studio | Design • Print • Video</title>
    <script>
      (() => {
        const savedTheme = localStorage.getItem('alex-theme');
        const isDark = savedTheme ? savedTheme === 'dark' : true;
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
